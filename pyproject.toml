[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethercat-tool"
version = "0.1.0"
description = "EtherCAT network troubleshooting: scan slaves, topology map, link diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pysoem>=1.1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
ethercat-tool = "ethercat_tool.cli:main_or_exit"

[tool.setuptools.packages.find]
where = ["."]
include = ["ethercat_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["ethercat_tool", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["ethercat_tool"]

[[tool.mypy.overrides]]
module = "pysoem.*"
ignore_missing_imports = true
